# Платформа внедрения ИИ инструментов — запуск в Docker
# Использование: docker compose up -d
# Открыть: http://localhost:19080 (нестандартный порт для инфраструктуры с ограничением портов)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mik_platform
      POSTGRES_USER: mik
      POSTGRES_PASSWORD: mik_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mik -d mik_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    ports:
      - "19080:19080"
    environment:
      - NODE_ENV=production
      - PORT=19080
      - DATABASE_URL=postgresql://mik:mik_pass@db:5432/mik_platform
      - QWEN_27B_BASE_URL=${QWEN_27B_BASE_URL:-https://i.moscow/api/dit/proxy/operation/openqwen/model-v43/v1}
      - QWEN_35B_BASE_URL=${QWEN_35B_BASE_URL:-https://i.moscow/api/dit/proxy/operation/openqwen/model-v41/v1}
      - QWEN_27B_MODEL=${QWEN_27B_MODEL:-local_huggingface/Qwen3.6-27B}
      - QWEN_35B_MODEL=${QWEN_35B_MODEL:-local_huggingface/Qwen3.6-35B-A3B}
      - QWEN_REQUEST_TIMEOUT_MS=${QWEN_REQUEST_TIMEOUT_MS:-2400000}
      - QWEN_PROXY_TOKEN=${QWEN_PROXY_TOKEN:-}
      - QWEN_SETTINGS_KEY=${QWEN_SETTINGS_KEY:-}
      - AUDIO_ASSISTANT_MAX_UPLOAD_BYTES=${AUDIO_ASSISTANT_MAX_UPLOAD_BYTES:-1048576000}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:19080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pg_data:
  uploads_data:
